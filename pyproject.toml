[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative2domain"
version = "0.1.0"
description = "Convert narrative requirements into a domain model (CLI & GUI)."
requires-python = ">=3.11"

authors = [
  { name = "Anton Nozdrin", email = "you@example.com" }
]

readme  = "README.md"
license = { text = "MIT" }

# ─────────────── основные зависимости ───────────────
dependencies = [
  "tomli_w>=1.0",
  "openai>=1.30",
  "graphviz>=0.20"
]

# ─────────────── дополнительные группы ───────────────
[project.optional-dependencies]
gui = ["PySide6>=6.7"]          # ставить, если нужен GUI
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

# ─────────────── ссылки проекта (URL-ы) ───────────────
[project.urls]
Homepage = "https://github.com/your-repo/narrative2domain"