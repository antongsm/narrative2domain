[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative2domain"
version = "0.1.0"
description = "Convert narrative requirements into a domain model (CLI & GUI)."
requires-python = ">=3.11"

# ──────────────────────────────────
# Основные зависимости
# ──────────────────────────────────
dependencies = [
  # TOML-запись — только если вы хотите сохранять конфиг
  "tomli_w>=1.0",                       # безопасная запись TOML
  "openai>=1.30",                       # GPT- и Whisper-клиент
  "graphviz>=0.20",                     # генерация SVG-диаграмм
  # PySide6 нужен только там, где запускается GUI
  "PySide6>=6.7 ; platform_system!='Linux' and platform_system!='Darwin' and platform_system!='Windows'",  # условно (пример)
]

# ──────────────────────────────────
# Опциональные группы (extras)
# ──────────────────────────────────
[project.optional-dependencies]
# Для GUI на всех ОС с поддержкой колёс PySide6
gui = ["PySide6>=6.7"]

# Для разработки
dev = [
  "pytest",
  "pytest-cov",
  "ruff",         # линтер/форматтер
  "mypy",
]

# ──────────────────────────────────
# Метаданные (можно дополнить)
# ──────────────────────────────────
authors = [{ name = "Ваше имя", email = "you@example.com" }]
readme = "README.md"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
